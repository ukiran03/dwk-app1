apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwk-app1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ukiran03/dwk-app1.git
    path: .
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
